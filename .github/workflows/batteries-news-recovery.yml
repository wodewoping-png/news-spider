name: Batteries News late-post recovery

on:
  push:
    branches: [main]
    paths:
      - "src/batteries_news_recovery.py"
      - ".github/workflows/batteries-news-recovery.yml"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional end date for late-post recovery (YYYY-MM-DD)"
        required: false
        type: string

concurrency:
  group: news-spider-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recover visible late posts
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL || 'glm-5.2' }}
          ZAI_API_URL: ${{ vars.ZAI_API_URL || 'https://open.bigmodel.cn/api/anthropic' }}
        run: python -m src.batteries_news_recovery --target-date "$TARGET_DATE" --logs "$RUNNER_TEMP/batteries-news-recovery"
      - name: Commit recovered articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No late Batteries News posts to commit."
          else
            git commit -m "chore: recover late Batteries News posts"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
