name: Daily News Spider

on:
  schedule:
    # 06:00 Asia/Shanghai: collect the complete previous local calendar day.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional publication date to collect (YYYY-MM-DD)"
        required: false
        type: string

concurrency:
  group: news-spider-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill previously confirmed channel gaps
        continue-on-error: true
        run: |
          python -m src.recovery run --sources sources.xlsx

      - name: Run crawler
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          args=(--sources sources.xlsx)
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m src.main "${args[@]}"

      - name: Publish channel audit summary
        if: always()
        run: |
          if [ -f logs/audit-report.md ]; then
            cat logs/audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Channel audit report unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send DingTalk channel alert
        if: always()
        continue-on-error: true
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m src.notifications

      - name: Upload data and logs artifact
        uses: actions/upload-artifact@v6
        with:
          name: news-spider-output
          path: |
            data/
            logs/
          if-no-files-found: warn

      - name: Commit data and logs
        run: |
          branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          if [ -z "$branch" ]; then
            branch="${{ github.event.repository.default_branch }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data logs
          if git diff --cached --quiet; then
            echo "No data/log changes to commit."
          else
            git commit -m "chore: update crawled news data"
            git pull --rebase --autostash origin "$branch"
            git push origin "HEAD:$branch"
          fi

      - name: Report uncollected channels
        if: always()
        run: |
          python -m src.recovery check --warn-only
