name: Daily News Spider

on:
  schedule:
    # 06:00 Asia/Shanghai: collect the complete previous local calendar day.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional publication date to collect (YYYY-MM-DD)"
        required: false
        type: string
      dingtalk_test:
        description: "Send a DingTalk connection test without running the crawler"
        required: false
        default: false
        type: boolean
      the_information_only:
        description: "Run only the authenticated The Information recovery check"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-spider-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.the_information_only != true }}
    runs-on: ubuntu-latest
    outputs:
      retry_the_information: ${{ steps.the_information_status.outputs.retry }}
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare RIOnews daily exports
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true }}
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          RIO_USERNAME: ${{ secrets.RIO_USERNAME }}
          RIO_PASSWORD: ${{ secrets.RIO_PASSWORD }}
          RIO_BASE_URL: ${{ vars.RIO_BASE_URL }}
          RIO_SYSTEM_TYPE: ${{ vars.RIO_SYSTEM_TYPE }}
          RIO_DAYS: ${{ vars.RIO_DAYS || '7' }}
        run: |
          daily_dir="$RUNNER_TEMP/rionews/daily"
          echo "RIONEWS_DAILY_DIR=$daily_dir" >> "$GITHUB_ENV"
          if [ -z "$RIO_USERNAME" ] || [ -z "$RIO_PASSWORD" ]; then
            echo "RIOnews credentials are not configured; affected channels will use their public-site fallback scrapers."
            exit 0
          fi
          args=(--daily-output-dir "$daily_dir" --days "$RIO_DAYS")
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m src.rionews_fetch "${args[@]}"

      - name: Run unified channel operations cycle
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true }}
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          THE_INFORMATION_RSS_USERNAME: ${{ secrets.THE_INFORMATION_RSS_USERNAME }}
          THE_INFORMATION_RSS_PASSWORD: ${{ secrets.THE_INFORMATION_RSS_PASSWORD }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD || secrets.DINGTALK_KEYWORD }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL || 'glm-5.2' }}
          ZAI_API_URL: ${{ vars.ZAI_API_URL || 'https://open.bigmodel.cn/api/anthropic' }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--sources sources.xlsx)
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m src.channel_ops cycle "${args[@]}"

      - name: Detect The Information access failure
        id: the_information_status
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true) }}
        shell: bash
        run: |
          retry="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("logs/channel-health.json")
          retry = False
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              for item in payload.get("sources", []):
                  if str(item.get("source") or "").strip().lower() != "the information":
                      continue
                  detail = " ".join(
                      str(item.get(key) or "")
                      for key in ("reason", "error", "technical_reason")
                  ).lower()
                  status = str(item.get("status") or "").lower()
                  crawl_mode = str(item.get("crawl_mode") or "").lower()
                  retry = crawl_mode == "rss_public_fallback" or (
                      status == "failed"
                      and ("cloudflare challenge" in detail or "http 403" in detail)
                  )
                  break
          print("true" if retry else "false")
          PY
          )"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Publish channel operations summary
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true) }}
        run: |
          if [ -f logs/channel-ops-report.md ]; then
            cat logs/channel-ops-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Channel operations report unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test DingTalk notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dingtalk_test == true }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD || secrets.DINGTALK_KEYWORD }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m src.notifications --test

      - name: Upload data and logs artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true }}
        uses: actions/upload-artifact@v6
        with:
          name: news-spider-output
          path: |
            data/
            logs/
          if-no-files-found: warn

      - name: Commit data and logs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true }}
        run: |
          branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          if [ -z "$branch" ]; then
            branch="${{ github.event.repository.default_branch }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data logs
          if git diff --cached --quiet; then
            echo "No data/log changes to commit."
          else
            git commit -m "chore: update crawled news data"
            git pull --rebase --autostash origin "$branch"
            git push origin "HEAD:$branch"
          fi

      - name: Report channels requiring maintenance
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dingtalk_test != true) }}
        run: |
          python -m src.channel_ops check --warn-only

  recover-the-information:
    name: Retry The Information on alternate runner
    needs: crawl
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.the_information_only == true) || (needs.crawl.result == 'success' && needs.crawl.outputs.retry_the_information == 'true')) }}
    # The normal crawl already runs on Azure-hosted Linux. A macOS runner uses a
    # different standard GitHub egress path without solving or bypassing challenges.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout latest branch data
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retry authenticated subscriber feed
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          THE_INFORMATION_RSS_USERNAME: ${{ secrets.THE_INFORMATION_RSS_USERNAME }}
          THE_INFORMATION_RSS_PASSWORD: ${{ secrets.THE_INFORMATION_RSS_PASSWORD }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL || 'glm-5.2' }}
          ZAI_API_URL: ${{ vars.ZAI_API_URL || 'https://open.bigmodel.cn/api/anthropic' }}
        run: |
          retry_logs="$RUNNER_TEMP/the-information-recovery"
          args=(
            --sources sources.xlsx
            --only-source "the information"
            --logs "$retry_logs"
            --skip-audit
          )
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m src.main "${args[@]}"
          python - "$retry_logs/channel-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          item = next(
              row
              for row in payload.get("sources", [])
              if str(row.get("source") or "").strip().lower() == "the information"
          )
          status = str(item.get("status") or "").lower()
          crawl_mode = str(item.get("crawl_mode") or "").lower()
          if status not in {"healthy", "idle"} or crawl_mode != "rss_authenticated":
              raise SystemExit(
                  "The Information authenticated full-text feed is still unavailable: "
                  f"status={status}, crawl_mode={crawl_mode}, reason={item.get('reason', '')}"
              )
          print(
              "The Information authenticated feed recovered on the fresh runner: "
              f"status={status}, usable={item.get('usable_articles', 0)}"
          )
          PY

      - name: Commit recovered full-text data
        run: |
          branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Authenticated feed succeeded; no new data changes to commit."
          else
            git commit -m "chore: recover The Information full-text data"
            git pull --rebase --autostash origin "$branch"
            git push origin "HEAD:$branch"
          fi
