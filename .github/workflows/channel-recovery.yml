name: Channel Recovery

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Exact channel/source name"
        required: true
        type: string
      action:
        description: "Confirm fixed channel for recovery, or ignore the incident"
        required: true
        default: confirm
        type: choice
        options:
          - confirm
          - ignore
      note:
        description: "Human confirmation / repair note"
        required: true
        type: string

concurrency:
  group: news-spider-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare RIOnews exports for the selected channel's missing dates
        if: ${{ inputs.action == 'confirm' }}
        continue-on-error: true
        env:
          RECOVERY_SOURCE: ${{ inputs.source }}
          RIO_USERNAME: ${{ secrets.RIO_USERNAME }}
          RIO_PASSWORD: ${{ secrets.RIO_PASSWORD }}
          RIO_BASE_URL: ${{ vars.RIO_BASE_URL }}
          RIO_SYSTEM_TYPE: ${{ vars.RIO_SYSTEM_TYPE }}
          RIO_DAYS: ${{ vars.RIO_DAYS || '7' }}
        run: |
          case "$RECOVERY_SOURCE" in
            中国能源网|电池网|我爱电车网|国际能源网|北极星储能网) ;;
            *) echo "Selected channel does not use RIOnews; skipping export."; exit 0 ;;
          esac
          daily_dir="$RUNNER_TEMP/rionews/daily"
          echo "RIONEWS_DAILY_DIR=$daily_dir" >> "$GITHUB_ENV"
          if [ -z "$RIO_USERNAME" ] || [ -z "$RIO_PASSWORD" ]; then
            echo "RIOnews credentials are not configured; recovery will use public-site fallbacks."
            exit 0
          fi
          days="$(python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          source = os.environ['RECOVERY_SOURCE']
          queue = Path('logs/recovery-queue.json')
          incidents = json.loads(queue.read_text(encoding='utf-8')).get('incidents', []) if queue.exists() else []
          dates = []
          for item in incidents:
              if item.get('source') == source and item.get('status') in {'pending_confirmation', 'confirmed', 'recovery_failed'}:
                  try:
                      dates.append(date.fromisoformat(item['date']))
                  except (KeyError, TypeError, ValueError):
                      pass
          baseline = max(1, int(os.environ.get('RIO_DAYS') or 7))
          print(max(baseline, (date.today() - min(dates)).days + 2) if dates else baseline)
          PY
          )"
          python -m src.rionews_fetch --daily-output-dir "$daily_dir" --days "$days"

      - name: Resolve incident and run maintenance
        env:
          RECOVERY_ACTION: ${{ inputs.action }}
          RECOVERY_SOURCE: ${{ inputs.source }}
          RECOVERY_NOTE: ${{ inputs.note }}
          THE_INFORMATION_RSS_USERNAME: ${{ secrets.THE_INFORMATION_RSS_USERNAME }}
          THE_INFORMATION_RSS_PASSWORD: ${{ secrets.THE_INFORMATION_RSS_PASSWORD }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD || secrets.DINGTALK_KEYWORD }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(
            resolve "$RECOVERY_ACTION"
            --source "$RECOVERY_SOURCE"
            --note "$RECOVERY_NOTE"
            --sources sources.xlsx
            --notify
          )
          if [ "$RECOVERY_ACTION" = "confirm" ]; then
            args+=(--run)
          fi
          python -m src.channel_ops "${args[@]}"

      - name: Publish channel operations summary
        if: always()
        run: |
          if [ -f logs/channel-ops-report.md ]; then
            cat logs/channel-ops-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit recovery result
        if: always()
        run: |
          branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          if [ -z "$branch" ]; then
            branch="${{ github.event.repository.default_branch }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data logs
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
          else
            git commit -m "chore: recover missing channel data"
            git pull --rebase --autostash origin "$branch"
            git push origin "HEAD:$branch"
          fi
