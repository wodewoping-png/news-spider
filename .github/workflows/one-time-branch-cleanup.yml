name: One-time merged PR branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only reviewed merged PR branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SELF_BRANCH: codex/cleanup-merged-pr-branches-20261023
          MANIFEST: |
            {"branch":"agent/add-zai-industry-classification","sha":"369f74ca24982411e4c0b1d8d56a98ceedc55b60","pr":14}
            {"branch":"agent/close-international-20260823","sha":"14230d77b01b62f4cb0238e184e0d408b613628b","pr":23}
            {"branch":"agent/expand-industry-taxonomy","sha":"03155890f6624ebe6d0237014ded007a148f848d","pr":17}
            {"branch":"agent/finalize-no-news-recovery","sha":"79c708e54c0c3e8b0d3b9b6120f272eba0568362","pr":20}
            {"branch":"agent/fix-anthropic-classification-json","sha":"e6ce9b3373e4d45637171a358ea1dcac448a5a51","pr":16}
            {"branch":"agent/fix-news-source-and-zai-errors","sha":"cae2a26a8b6bd0bdd2496ef0581645a93d666a61","pr":15}
            {"branch":"agent/international-energy-mobile-fallback","sha":"320f960d337c480ba8e83edf3b3f253cd3fc631d","pr":22}
            {"branch":"agent/international-energy-rss","sha":"cf81f3292033f9b07feca1b4c9cfbd4d8df02768","pr":21}
            {"branch":"agent/local-the-information-ingest","sha":"56da4d05cf54d4abf342c6ed53b79de212401c2a","pr":29}
            {"branch":"agent/maintain-recent-source-errors","sha":"b0bf8d7a89b9da0e5b2309e016c89d3544d7bc63","pr":19}
            {"branch":"agent/renewables-now-content-quality","sha":"e98886f1fac86201c082dbbfcdd3289743482db9","pr":24}
            {"branch":"agent/the-information-macos-recovery","sha":"b0315c4664d8f135c7dd084fb7212261f8847a80","pr":26}
            {"branch":"agent/the-information-waf-retry","sha":"3f466b2e06d420ac41f29a574163e0b690743285","pr":25}
            {"branch":"agent/uied-perovskite-fix","sha":"9d0500579a51afa92b0a99e2925966e15c367edb","pr":28}
            {"branch":"codex/central-policy-channels-20261021","sha":"ec719ff86d9b985a7106b948adc2edb56e195156","pr":35}
            {"branch":"codex/central-policy-user-columns-20261022","sha":"2d3f072c2e478a7eb5f1351960ad63d3854ccd29","pr":39}
            {"branch":"codex/central-policy-wave2-20261021","sha":"857e7936244c1537564d65657a3889797a7ad54e","pr":36}
            {"branch":"codex/central-policy-wave3-20261021","sha":"06ad9f4d2d380bacdae007c6f61a860024451036","pr":37}
            {"branch":"codex/central-policy-wave4-20261021","sha":"ea04f336947c89d0dfa5952395995da17f6b14a7","pr":38}
            {"branch":"codex/daily-policy-list-attachments","sha":"c1422202b3adb199c45ca696e99eaf7c0630a254","pr":33}
            {"branch":"codex/government-announcement-archive","sha":"2f67ddee5cd2d39719b50be7047979af9c0b96f2","pr":32}
            {"branch":"codex/government-policy-weekly","sha":"35101c71d104fd7890ac7a788b08d6a6280db4c7","pr":34}
            {"branch":"codex/ithome-discovery-sastind-20261023","sha":"db9906ea5538531ec84d8a6d868bb4c6be4eaabe","pr":43}
            {"branch":"codex/policy-alternative-detail-dates-20261023","sha":"fdca1e57053491c2087fbb64791fca23426a399c","pr":41}
            {"branch":"codex/policy-archive-pdf-recovery-20261022","sha":"37f2197ab4e16192e795ff0adfa0c9994e630a86","pr":40}
            {"branch":"codex/robots-empty-file-policy-20261023","sha":"d7cb924351dee38b6340a103d2afc9916c42d798","pr":42}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          rows = [json.loads(line) for line in os.environ['MANIFEST'].splitlines() if line.strip()]
          self_branch = os.environ['SELF_BRANCH']
          assert len(rows) == 26 and len({row['branch'] for row in rows}) == 26
          assert all(row['branch'] not in {'main', 'the-information-inbox', self_branch} for row in rows)

          def request(path, method='GET'):
              url = 'https://api.github.com/repos/' + repository + '/' + path
              req = Request(url, method=method, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urlopen(req, timeout=20) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else {}
              except HTTPError as exc:
                  if exc.code == 404 and method == 'GET':
                      return None
                  raise

          def process(branch, number, expected_sha=None):
              if branch in {'main', 'the-information-inbox'}:
                  raise ValueError('refusing protected or retained branch')
              pr = request('pulls/' + str(number))
              if (not pr or not pr.get('merged_at') or
                  pr['head']['ref'] != branch or
                  pr['head']['repo']['full_name'] != repository or
                  pr['base']['ref'] != 'main'):
                  raise ValueError('PR does not prove a merged same-repo branch: ' + branch)
              ref_path = 'git/ref/heads/' + quote(branch, safe='/')
              ref = request(ref_path)
              if ref is None:
                  print('Already absent:', branch)
                  return
              actual_sha = ref['object']['sha']
              reference_sha = expected_sha or pr['head']['sha']
              if actual_sha != reference_sha:
                  raise ValueError('Branch advanced since review: ' + branch)
              request('git/refs/heads/' + quote(branch, safe='/'), method='DELETE')
              print('Deleted:', branch)

          failures = []
          for row in rows:
              try:
                  process(row['branch'], row['pr'], row['sha'])
              except Exception as exc:
                  failures.append(row['branch'])
                  print('FAILED:', row['branch'], str(exc), file=sys.stderr)

          # The cleanup PR branch is checked after this workflow file reaches main.
          # Its PR number is discovered from the exact branch, never from a wildcard.
          try:
              owner = repository.split('/', 1)[0]
              prs = request('pulls?state=closed&head=' + quote(owner + ':' + self_branch, safe=':'))
              matches = [pr for pr in prs or [] if pr['head']['ref'] == self_branch and pr.get('merged_at')]
              if len(matches) != 1:
                  raise ValueError('cleanup PR not uniquely merged')
              process(self_branch, matches[0]['number'])
          except Exception as exc:
              failures.append(self_branch)
              print('FAILED:', self_branch, str(exc), file=sys.stderr)

          print('Failed branch count:', len(failures))
          if failures:
              sys.exit(1)
          PY

