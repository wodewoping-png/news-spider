name: Government Announcements Archive

on:
  schedule:
    # 10:30 Asia/Shanghai: archive the previous local calendar day.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional publication date (YYYY-MM-DD)"
        required: false
        type: string
  push:
    paths:
      - "src/government_archive.py"
      - "src/policy_classifier.py"
      - "configs/policy_taxonomy.json"
      - "candidate_sources/government_announcements/central_policy_channels.json"
      - "candidate_sources/government_announcements/curated_policy.py"
      - "tests/test_government_archive.py"
      - ".github/workflows/government-announcements.yml"

concurrency:
  group: news-spider-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Validate archive layout
        run: python -m unittest discover -s tests -p 'test_government_archive.py'
      - name: Archive government notices and attachments
        id: archive
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL || 'glm-5.2' }}
          ZAI_API_URL: ${{ vars.ZAI_API_URL || 'https://open.bigmodel.cn/api/anthropic' }}
        run: |
          args=(--sources sources.xlsx --output-dir data/government_announcements --check-pending)
          if [ -n "$TARGET_DATE" ]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          python -m src.government_archive "${args[@]}"
      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: government-announcements-${{ github.run_id }}
          path: data/government_announcements/
          if-no-files-found: warn
      - name: Commit archive
        if: always()
        run: |
          branch="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/government_announcements ]; then
            git add -A data/government_announcements
          fi
          if git diff --cached --quiet; then
            echo "No government archive changes to commit."
          else
            git commit -m "chore: archive government announcements"
            git pull --rebase --autostash origin "$branch"
            git push origin "HEAD:$branch"
          fi
      - name: Report robots holds
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          indexes = list(Path('data/government_announcements').glob('*/索引.json'))
          if indexes:
              index = json.loads(max(indexes, key=lambda p: p.stat().st_mtime).read_text())
              holds = [source['source'] for source in index['sources'] if source['status'] == 'robots_hold']
              if holds:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('robots 暂缓渠道：' + '、'.join(holds) + '。每日索引保留原因，其他渠道继续归档。\n')
          PY
      - name: Report archive status
        if: ${{ steps.archive.outcome == 'failure' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          indexes = list(Path('data/government_announcements').glob('*/索引.json'))
          if indexes:
              index = json.loads(max(indexes, key=lambda p: p.stat().st_mtime).read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('政策清单已归档；以下项目仍需补抓：\n')
                  for source in index['sources']:
                      if source['status'] in {'ok', 'robots_hold'}:
                          continue
                      details = source.get('errors', []) + [
                          attachment.get('reason', attachment['status'])
                          for notice in source.get('notices', [])
                          for attachment in notice.get('attachments', [])
                          if attachment['status'] != 'downloaded'
                      ] + [
                          error for notice in source.get('notices', [])
                          for error in notice.get('errors', [])
                      ]
                      summary.write(f"- {source['source']}：{source['status']}；{'；'.join(details[:5])}\n")
          else:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('本次未生成政策索引，请检查归档步骤日志。\n')
          PY
          exit 1
